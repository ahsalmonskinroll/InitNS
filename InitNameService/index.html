    <script>
      function clearText() {
  let input = document.getElementById("nameInput");
  if (input.value === "Claim your name") {
    input.value = "";
  }
}

function restoreText() {
  let input = document.getElementById("nameInput");
  if (input.value === "") {
    input.value = "Claim your name";
  }
}

function changeTextColor() {
  let input = document.getElementById("nameInput");
  if (input.value.length > 0) {
    input.style.color = "#8B2EF9";
  } else {
    input.style.color = "#8C8C8C";
  }
}

// Check div görünürlüğünü ayarla
const input = document.getElementById("nameInput");
const infoBox = document.getElementById("infoBox");

input.addEventListener("input", function () {
  if (input.value.trim() !== "") {
    infoBox.style.display = "flex";
  } else {
    infoBox.style.display = "none";
  }
});

// "Check" butonuna tıklandığında işlemi yap
document.getElementById("check").addEventListener("click", function () {
  // Butonun ebeveyni olan "check-name" div'ini seç
  const parentDiv = this.parentElement;

  // Yeni içeriği oluştur
  const newContent = `
    <div class="row check-div">
      <div class="col df aic p-0">
        <div class="row">
          <div class="col-auto aic df je">
            <div class="check-btn">
              <img src="elements/Icons/Check.svg" alt="True" />
            </div>
          </div>
          <div class="col text-24 white-t">“name” is available.</div>
        </div>
      </div>
      <div class="col df je aic p-0">
        <button class="claim-btn text-14 black jc df aic wallet" id="claim">
          Claim now
        </button>
      </div>
    </div>
  `;

  // İçeriği değiştirmek için innerHTML kullan
  parentDiv.innerHTML = newContent;

  // Yeni "Claim" butonunu seç ve olay ekle
  document.getElementById("claim").addEventListener("click", function () {
    window.location.href = "claim.html";
  });
});

    </script>
